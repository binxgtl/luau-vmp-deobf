name: Luraph E2E sandbox

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/luraph-e2e-sandbox.yml"
      - "luauvmp/**"
      - "pyproject.toml"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: luraph-e2e-sandbox
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIXTURE_PATH: public-samples/Luraph/v14.7/001163f72ed972da.lua
      LUNE_VERSION: "0.10.5"
      # Keep the dynamic staged attempt tightly bounded. A non-converging
      # finalizer now falls back to the already validated strict capture and
      # still exercises dispatcher recovery plus full-tree devirtualisation.
      LUAUVMP_INSTRUCTION_BUDGET: "5000000"
      LUAUVMP_FINALIZE_FALLBACK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned public Luraph fixture
        uses: actions/checkout@v4
        with:
          repository: terrorlua/obfuscator-samples
          ref: a6ecd0ea7112c6a65d4b7acba40acc9e280301e3
          path: public-samples
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            Luraph/v14.7/001163f72ed972da.lua
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and tests
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m py_compile luauvmp/*.py tools/*.py
          python -m pytest -q

      - name: Install pinned Lune
        shell: bash
        run: |
          set -euxo pipefail
          BIN_DIR="$RUNNER_TEMP/lune-bin"
          ARCHIVE="$RUNNER_TEMP/lune.zip"
          rm -rf "$BIN_DIR" "$ARCHIVE"
          mkdir -p "$BIN_DIR"
          curl --fail --location --retry 3 \
            "https://github.com/lune-org/lune/releases/download/v${LUNE_VERSION}/lune-${LUNE_VERSION}-linux-x86_64.zip" \
            --output "$ARCHIVE"
          python - "$ARCHIVE" "$BIN_DIR" <<'PY'
          import sys, zipfile
          archive, destination = sys.argv[1:]
          with zipfile.ZipFile(archive) as zf:
              zf.extractall(destination)
          PY
          LUNE_BIN="$(find "$BIN_DIR" -type f -name lune -print -quit)"
          test -n "$LUNE_BIN"
          chmod +x "$LUNE_BIN"
          echo "$(dirname "$LUNE_BIN")" >> "$GITHUB_PATH"

      - name: Verify runtime
        shell: bash
        run: |
          set -euxo pipefail
          python --version
          luauvmp --help >/dev/null
          luauvmp-artifacts --help >/dev/null
          lune --version

      - name: Verify public fixture
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s "$FIXTURE_PATH" ]]; then
            echo "::error::Pinned public sample is missing"
            exit 1
          fi
          sha256sum "$FIXTURE_PATH"
          wc -c "$FIXTURE_PATH"

      - name: Run full Luraph pipeline
        id: pipeline
        shell: bash
        run: |
          set -o pipefail
          rm -rf recovered recovered.partial-* e2e.log
          timeout --signal=INT --kill-after=30s 600s \
            luauvmp luraph-full "$FIXTURE_PATH" \
              -o recovered --force --timeout 180 --no-lua-expert \
            2>&1 | tee e2e.log

      - name: Validate expected final output
        shell: bash
        run: |
          set -euxo pipefail
          test -f recovered/pipeline.json
          test -f recovered/program.pseudo.lua
          test -f recovered/program.decompiled.luau
          test -f recovered/artifacts/opcode_semantics.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("recovered")
          pipeline = json.loads((root / "pipeline.json").read_text(encoding="utf-8"))
          print("capture kind:", pipeline.get("capture_kind"))
          print("prototypes:", pipeline.get("prototypes"))
          print("instructions:", pipeline.get("instructions"))

          decompiler = pipeline.get("decompiler", {})
          semantics = json.loads((root / "artifacts/opcode_semantics.json").read_text())
          assert isinstance(semantics, dict) and semantics, "dispatcher recovery is empty"
          assert pipeline.get("opcode_slots", 0) > 0, "no opcode slots recovered"
          assert pipeline.get("payload_executed") is False, "payload was executed"
          assert pipeline.get("final_payload_executed") is False, "final payload was executed"
          assert decompiler.get("compile_checked") is True, "compile check failed"
          assert decompiler.get("fallback_instructions") == 0, "semantic fallback present"
          assert decompiler.get("unresolved_dispatcher_conditionals") == 0, "unresolved branch"
          print("E2E quality gate passed")
          PY

      - name: Print compact failure trace
        if: failure()
        shell: bash
        run: |
          set +e
          echo "===== e2e.log tail ====="
          tail -n 250 e2e.log 2>/dev/null || true
          echo "===== retained partial directories ====="
          find . -maxdepth 2 -type d -name 'recovered.partial-*' -print
