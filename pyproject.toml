[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "luau-vmp-deobf"
version = "0.3.4"
description = "Static and sandbox-assisted devirtualizer for Luau custom bytecode VMs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["luau", "lua", "deobfuscation", "reverse-engineering", "bytecode", "devirtualization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
luauvmp = "luauvmp.cli:main"

[tool.setuptools.packages.find]
include = ["luauvmp*", "tools*"]
