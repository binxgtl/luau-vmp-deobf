[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "luau-vmp-deobf"
version = "0.5.2"
description = "Luau/Lua VM deobfuscator and Luraph v14.x devirtualizer with static and sandbox-assisted analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "zstandard>=0.22,<1",
]
license = { text = "MIT" }
keywords = [
  "luau", "lua", "luraph", "luraph-v14", "moonveil", "deobfuscation",
  "reverse-engineering", "bytecode", "devirtualization", "vm-protection"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
luauvmp = "luauvmp.cli:main"
luauvmp-artifacts = "luauvmp.luraph_artifacts:main"
luauvmp-vm-diagnose = "luauvmp.luraph_vm_diagnostics:main"

[tool.setuptools.packages.find]
include = ["luauvmp*", "tools*"]
